<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Planer – Mehr-Menü</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#ffd100}a:hover{color:#ffe566}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: {{accent}}; font-family: 'Barlow', sans-serif; color: #0a0a0a; position: relative; overflow: hidden">

  <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 26px" aria-hidden="true">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1">Hallo! <span style="font-weight: 600">Di, 13. Okt.</span></div>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 80px; line-height: 0.95">2.847,50 €</div>
    <div style="height: 60px; border-radius: 18px; background: #0a0a0a; width: 170px"></div>
    <div style="height: 120px; border-radius: 24px; background: #ffffff; border: 3px solid #0a0a0a"></div>
    <div style="height: 60px; border-radius: 16px; background: #0a0a0a"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(10,10,10,0.55)"></div>

  <aside aria-label="Mehr" style="position: absolute; top: 0; right: 0; bottom: 0; width: 304px; background: #0a0a0a; color: #ffffff; border-radius: 28px 0 0 28px; padding: 20px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3"></rect><path d="M4 11h16"></path><path d="M12 3v8"></path><path d="M7 21v-3"></path><path d="M17 21v-3"></path></svg>
      </div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; flex: 1">Mehr</div>
      <button aria-label="Menü schließen" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #333338; background: #18181b; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
      </button>
    </div>

    <sc-for list="{{punkte}}" as="p" hint-placeholder-count="5">
      <button style="height: 64px; border-radius: 18px; border: none; background: #18181b; color: #ffffff; display: flex; align-items: center; gap: 14px; padding: 0 14px; text-align: left">
        <span style="width: 38px; height: 38px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-weight: 700; font-size: 16px">{{p.titel}}</span>
          <span style="font-size: 12px; color: #b8b8bd">{{p.text}}</span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6b73" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
    </sc-for>

    <div style="flex: 1"></div>

    <div style="display: flex; align-items: center; gap: 12px; background: #18181b; border-radius: 18px; padding: 12px 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffd100" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>
      <span style="flex: 1; font-weight: 700; font-size: 15px">Dunkelmodus</span>
      <button aria-label="Dunkelmodus ein- oder ausschalten" style="width: 54px; height: 32px; border-radius: 16px; border: none; background: #3a3a3f; padding: 3px; display: flex; justify-content: flex-start">
        <span style="width: 26px; height: 26px; border-radius: 13px; background: #ffffff; display: block"></span>
      </button>
    </div>
    <button style="height: 52px; border-radius: 16px; border: 1px solid #3a3a3f; background: transparent; color: #ffffff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg>
      Abmelden
    </button>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd100","options":["#ffd100","#ffc400","#ffdd33","#f5b800"]},"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#ffd100',
      punkte: [
        { titel: 'Dienstverlauf', text: 'Ablauf und Ereignisse', icon: 'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z' },
        { titel: 'Dienstliste', text: 'Monatsliste und PDFs', icon: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01' },
        { titel: 'Fehlermeldungen', text: 'Bus-Symbole nachschlagen', icon: 'M12 3 2 20h20L12 3ZM12 10v4M12 17h.01' },
        { titel: 'Haltestellen', text: 'Kürzel und Namen', icon: 'M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21ZM12 7.5v4' },
        { titel: 'Einstellungen', text: 'Verdienst, Zuschläge, Name', icon: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4' }
      ]
    };
  }
}
</script>
</body>
</html>
