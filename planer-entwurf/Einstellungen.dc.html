<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Planer – Einstellungen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,select{font-family:inherit}
button{cursor:pointer}
a{color:#0a0a0a}a:hover{color:#333}
</style>
</helmet>
<div style="width: 390px; height: 1360px; box-sizing: border-box; background: {{accent}}; font-family: 'Barlow', sans-serif; color: #0a0a0a; position: relative; overflow: hidden; padding: 18px 16px 24px 16px; display: flex; flex-direction: column; gap: 12px">

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px">
    <button aria-label="Zurück" style="width: 44px; height: 44px; border-radius: 14px; border: none; background: #0a0a0a; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffd100" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1; flex: 1">Einstellungen</div>
  </div>

  <div style="background: #ffffff; border: 3px solid #0a0a0a; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; text-transform: uppercase">Verdienst</div>
      <div style="font-size: 12px; font-weight: 700; background: #0a0a0a; color: {{accent}}; border-radius: 8px; padding: 3px 8px">TV-N Berlin</div>
    </div>
    <div style="font-size: 13px; color: #3b3a35; line-height: 1.35">Die Werte stehen auf deiner Verdienstabrechnung.</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{felder}}" as="f" hint-placeholder-count="7">
        <div style="{{f.spalte}}">
          <label for="{{f.id}}" style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px">{{f.label}}</label>
          <input id="{{f.id}}" value="{{f.wert}}" style="width: 100%; height: 46px; box-sizing: border-box; border-radius: 13px; border: 2px solid #0a0a0a; padding: 0 12px; font-size: 16px; font-weight: 600">
        </div>
      </sc-for>
    </div>
  </div>

  <div style="background: #0a0a0a; color: #ffffff; border-radius: 22px; padding: 6px 14px 14px 14px; display: flex; flex-direction: column; gap: 10px">
    <button aria-expanded="true" style="height: 50px; border: none; background: transparent; color: #ffffff; display: flex; align-items: center; padding: 0; font-weight: 800; font-size: 16px">
      <span style="flex: 1; text-align: left">Zuschlagssätze (%)</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffd100" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>
    </button>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{zuschlaege}}" as="z" hint-placeholder-count="6">
        <div style="background: #1c1c1e; border-radius: 14px; padding: 8px 10px">
          <label for="{{z.id}}" style="font-size: 11px; font-weight: 700; color: #c9c9c9; display: block">{{z.label}}</label>
          <input id="{{z.id}}" value="{{z.wert}}" style="width: 100%; box-sizing: border-box; border: none; background: transparent; color: #ffd100; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; padding: 0">
        </div>
      </sc-for>
    </div>
  </div>

  <button aria-expanded="false" style="height: 58px; border-radius: 18px; border: none; background: #0a0a0a; color: #ffffff; display: flex; align-items: center; padding: 0 14px; font-weight: 800; font-size: 16px">
    <span style="flex: 1; text-align: left">Zeitfenster (Nacht, Samstag)</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffd100" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
  <button aria-expanded="false" style="height: 58px; border-radius: 18px; border: none; background: #0a0a0a; color: #ffffff; display: flex; align-items: center; padding: 0 14px; font-weight: 800; font-size: 16px">
    <span style="flex: 1; text-align: left">Verpflegungsmehraufwand</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffd100" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
  </button>

  <div style="background: #ffffff; border: 3px solid #0a0a0a; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
    <label for="e-name" style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px">Name für die PDFs (optional)</label>
    <input id="e-name" placeholder="Vorname Nachname" style="height: 46px; box-sizing: border-box; border-radius: 13px; border: 2px solid #0a0a0a; padding: 0 12px; font-size: 16px; font-weight: 600">
  </div>

  <div style="background: #ffffff; border: 3px solid #0a0a0a; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px">Darstellung</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #f1f0ec; border-radius: 14px; padding: 4px">
      <button style="height: 42px; border-radius: 11px; border: none; background: #0a0a0a; color: #ffd100; font-weight: 700; font-size: 14px">Automatisch</button>
      <button style="height: 42px; border-radius: 11px; border: none; background: transparent; color: #0a0a0a; font-weight: 600; font-size: 14px">Hell</button>
      <button style="height: 42px; border-radius: 11px; border: none; background: transparent; color: #0a0a0a; font-weight: 600; font-size: 14px">Dunkel</button>
    </div>
  </div>

  <button style="height: 62px; border-radius: 20px; border: none; background: #0a0a0a; color: {{accent}}; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: 0.5px">Speichern</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd100","options":["#ffd100","#ffc400","#ffdd33","#f5b800"]},"$preview":{"width":390,"height":1360}}'>
class Component extends DCLogic {
  renderVals() {
    const halb = '';
    const voll = 'grid-column: 1 / -1;';
    return {
      accent: this.props.accent ?? '#ffd100',
      felder: [
        { id: 'e-eg', label: 'Entgeltgruppe', wert: 'E 5', spalte: halb },
        { id: 'e-stufe', label: 'Stufe', wert: '3', spalte: halb },
        { id: 'e-monat', label: 'Monatsentgelt €', wert: '3.365,46', spalte: halb },
        { id: 'e-woche', label: 'Wochenstunden', wert: '37,5', spalte: halb },
        { id: 'e-unreg', label: 'Unregelm. Dienste €', wert: '255,00', spalte: halb },
        { id: 'e-pausch', label: 'Pausch. Dienstkl. €', wert: '80,00', spalte: halb },
        { id: 'e-zz', label: 'Entgelt stdl. ZZ € (Basis Zuschläge)', wert: '19,85', spalte: voll }
      ],
      zuschlaege: [
        { id: 'z-nacht', label: 'Nacht', wert: '25' },
        { id: 'z-sa', label: 'Samstag', wert: '20' },
        { id: 'z-so', label: 'Sonntag', wert: '25' },
        { id: 'z-ft', label: 'Feiertag', wert: '135' },
        { id: 'z-st', label: 'Sondertag', wert: '40' },
        { id: 'z-mehr', label: 'Mehrarbeit', wert: '30' }
      ]
    };
  }
}
</script>
</body>
</html>
