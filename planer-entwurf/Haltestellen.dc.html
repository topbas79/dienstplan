<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Planer – Haltestellen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:#0a0a0a}a:hover{color:#333}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: {{accent}}; font-family: 'Barlow', sans-serif; color: #0a0a0a; position: relative; overflow: hidden; padding: 18px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px">
    <button aria-label="Zurück" style="width: 44px; height: 44px; border-radius: 14px; border: none; background: #0a0a0a; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffd100" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1; flex: 1">Haltestellen</div>
  </div>

  <div style="font-size: 14px; font-weight: 600; padding: 0 4px; line-height: 1.35">Deine eigene Liste: Kürzel aus dem Dienstplan und der volle Name. Sie wächst beim PDF-Import automatisch mit.</div>

  <div style="background: #ffffff; border: 3px solid #0a0a0a; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px">
      <div>
        <label for="h-kurz" style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px">Kürzel</label>
        <input id="h-kurz" placeholder="UJTC03" style="width: 100%; height: 46px; box-sizing: border-box; border-radius: 13px; border: 2px solid #0a0a0a; padding: 0 12px; font-size: 16px; font-weight: 600">
      </div>
      <div>
        <label for="h-name" style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px">Voller Name</label>
        <input id="h-name" placeholder="U Johannisthaler Chaussee" style="width: 100%; height: 46px; box-sizing: border-box; border-radius: 13px; border: 2px solid #0a0a0a; padding: 0 12px; font-size: 16px; font-weight: 600">
      </div>
    </div>
    <button style="height: 50px; border-radius: 15px; border: none; background: #0a0a0a; color: {{accent}}; font-weight: 800; font-size: 16px">Speichern</button>
  </div>

  <div style="position: relative">
    <label for="h-suche" style="position: absolute; left: -9999px">Haltestelle suchen</label>
    <input id="h-suche" placeholder="Suchen …" style="width: 100%; height: 50px; box-sizing: border-box; border-radius: 16px; border: none; background: rgba(10,10,10,0.1); padding: 0 14px 0 44px; font-size: 16px; font-weight: 500; color: #0a0a0a">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 15px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
  </div>

  <div style="background: #0a0a0a; color: #ffffff; border-radius: 22px; padding: 4px 14px; display: flex; flex-direction: column">
    <sc-for list="{{liste}}" as="h" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid #262626">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: #ffd100; width: 80px; flex-shrink: 0">{{h.k}}</span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">{{h.n}}</span>
        <button aria-label="Bearbeiten" style="width: 36px; height: 36px; border-radius: 11px; border: 1px solid #3a3a3f; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"></path></svg>
        </button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd100","options":["#ffd100","#ffc400","#ffdd33","#f5b800"]},"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#ffd100',
      liste: [
        { k: 'UJTC03', n: 'U Johannisthaler Chaussee' },
        { k: 'UHPL', n: 'U Hermannplatz' },
        { k: 'SSWD', n: 'S Schöneweide' },
        { k: 'BHF', n: 'Betriebshof' },
        { k: '[KÜRZEL]', n: '[Haltestelle]' },
        { k: '[KÜRZEL]', n: '[Haltestelle]' },
        { k: '[KÜRZEL]', n: '[Haltestelle]' }
      ]
    };
  }
}
</script>
</body>
</html>
