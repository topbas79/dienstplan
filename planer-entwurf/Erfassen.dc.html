<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Planer – Dienst erfassen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,select{font-family:inherit}
button{cursor:pointer}
a{color:#0a0a0a}a:hover{color:#333}
</style>
</helmet>
<div style="width: 390px; height: 1360px; box-sizing: border-box; background: {{accent}}; font-family: 'Barlow', sans-serif; color: #0a0a0a; position: relative; overflow: hidden; padding: 18px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px 2px 4px">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1; flex: 1">Dienst erfassen</div>
    <button aria-label="Weitere Aktionen" style="width: 44px; height: 44px; border-radius: 14px; border: none; background: #0a0a0a; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffd100" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
    </button>
  </div>

  <button style="height: 56px; border-radius: 18px; border: 3px dashed #0a0a0a; background: transparent; color: #0a0a0a; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"></path><path d="M14 3v5h5"></path><path d="M12 12v6"></path><path d="m9 15 3 3 3-3"></path></svg>
    Dienstplan-PDF importieren
  </button>

  <div style="background: #ffffff; border: 3px solid #0a0a0a; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="f-datum" style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.1px">Datum</label>
        <input id="f-datum" value="Mi, 14.10.2026" style="height: 48px; border-radius: 14px; border: 2px solid #0a0a0a; padding: 0 12px; font-size: 16px; font-weight: 600; box-sizing: border-box; width: 100%">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="f-dienst" style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.1px">Dienstnummer</label>
        <input id="f-dienst" value="3104" style="height: 48px; border-radius: 14px; border: 2px solid #0a0a0a; padding: 0 12px; font-size: 16px; font-weight: 600; box-sizing: border-box; width: 100%">
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="f-beginn" style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.1px">Beginn</label>
        <input id="f-beginn" value="05:12" style="height: 64px; border-radius: 16px; border: none; background: #0a0a0a; color: #ffd100; padding: 0 14px; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; box-sizing: border-box; width: 100%">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="f-ende" style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.1px">Ende</label>
        <input id="f-ende" value="13:40" style="height: 64px; border-radius: 16px; border: none; background: #0a0a0a; color: #ffd100; padding: 0 14px; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; box-sizing: border-box; width: 100%">
      </div>
    </div>
    <button style="height: 40px; border: none; background: transparent; color: #0a0a0a; font-weight: 700; font-size: 14px; text-align: left; padding: 0; text-decoration: underline">+ Tatsächliches Ende angeben (optional)</button>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.1px">Pausenregel</div>
        <button aria-label="Hilfe zu Pausen" style="width: 28px; height: 28px; border-radius: 14px; border: 2px solid #0a0a0a; background: transparent; font-weight: 800; font-size: 14px; padding: 0">?</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #f1f0ec; border-radius: 16px; padding: 5px">
        <button style="height: 44px; border-radius: 12px; border: none; background: #0a0a0a; color: #ffd100; font-weight: 700; font-size: 14px">B30</button>
        <button style="height: 44px; border-radius: 12px; border: none; background: transparent; color: #0a0a0a; font-weight: 600; font-size: 14px">Sechstel</button>
        <button style="height: 44px; border-radius: 12px; border: none; background: transparent; color: #0a0a0a; font-weight: 600; font-size: 14px">Reserve</button>
      </div>
      <div style="font-size: 13px; color: #3b3a35">30 Min. unbezahlt</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.1px">Unbezahlte Pausen</div>
      <div style="display: flex; align-items: center; gap: 10px; background: #f1f0ec; border-radius: 14px; padding: 10px 12px">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; flex: 1">09:05 – 09:35</div>
        <div style="font-size: 13px; font-weight: 600; color: #3b3a35">30 Min.</div>
        <button aria-label="Pause entfernen" style="width: 32px; height: 32px; border-radius: 10px; border: none; background: #0a0a0a; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffd100" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
        </button>
      </div>
      <button style="height: 44px; border-radius: 14px; border: 2px solid #0a0a0a; background: #ffffff; color: #0a0a0a; font-weight: 700; font-size: 15px">+ Pause hinzufügen</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-feiertag" style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.1px">Feiertag / Sonderregelung</label>
      <select id="f-feiertag" style="height: 48px; border-radius: 14px; border: 2px solid #0a0a0a; padding: 0 12px; font-size: 15px; font-weight: 600; background: #ffffff; color: #0a0a0a">
        <option>Kein Feiertag / Normaler Tag</option>
      </select>
    </div>
  </div>

  <button style="height: 64px; border-radius: 20px; border: none; background: #0a0a0a; color: {{accent}}; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.5px; text-transform: uppercase">Berechnen</button>

  <div style="background: #0a0a0a; color: #ffffff; border-radius: 24px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; text-transform: uppercase">Auswertung</div>
      <div style="font-size: 13px; font-weight: 600; color: #c9c9c9">Mi 14.10.</div>
    </div>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 54px; line-height: 0.95; color: {{accent}}">198,63 €</div>
    <div style="font-size: 13px; color: #c9c9c9; margin-bottom: 4px">Tagesverdienst brutto</div>
    <div style="display: flex; justify-content: space-between; font-size: 15px; padding: 8px 0; border-top: 1px solid #2e2e2e"><span>Bezahlte Arbeitszeit</span><b>7:58 Std.</b></div>
    <div style="display: flex; justify-content: space-between; font-size: 15px; padding: 8px 0; border-top: 1px solid #2e2e2e"><span>Nacht (+25 %)</span><b>0:48 Std.</b></div>
    <div style="display: flex; justify-content: space-between; font-size: 15px; padding: 8px 0; border-top: 1px solid #2e2e2e"><span>Samstag (+20 %)</span><b>–</b></div>
    <div style="display: flex; justify-content: space-between; font-size: 15px; padding: 8px 0; border-top: 1px solid #2e2e2e"><span>Sonntag (+25 %)</span><b>–</b></div>
    <button style="height: 52px; margin-top: 6px; border-radius: 16px; border: none; background: {{accent}}; color: #0a0a0a; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      Im Kalender speichern
    </button>
  </div>

  <nav aria-label="Hauptmenü" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #0a0a0a; border-radius: 28px 28px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 10px 8px 10px">
    <button style="height: 56px; border: none; background: transparent; color: #d4d4d4; font-weight: 600; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg>Start</button>
    <button style="height: 56px; margin: 0 4px; border: none; border-radius: 16px; background: {{accent}}; color: #0a0a0a; font-weight: 700; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Erfassen</button>
    <button style="height: 56px; border: none; background: transparent; color: #d4d4d4; font-weight: 600; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>Kalender</button>
    <button style="height: 56px; border: none; background: transparent; color: #d4d4d4; font-weight: 600; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12"></path><path d="M8 12h12"></path><path d="M8 18h12"></path><path d="M4 6h.01"></path><path d="M4 12h.01"></path><path d="M4 18h.01"></path></svg>Liste</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd100","options":["#ffd100","#ffc400","#ffdd33","#f5b800"]},"$preview":{"width":390,"height":1360}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ffd100' };
  }
}
</script>
</body>
</html>
