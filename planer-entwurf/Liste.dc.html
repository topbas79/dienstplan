<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Planer – Dienstliste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#0a0a0a}a:hover{color:#333}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: {{accent}}; font-family: 'Barlow', sans-serif; color: #0a0a0a; position: relative; overflow: hidden; padding: 18px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1; flex: 1">Dienstliste</div>
    <button style="height: 44px; border-radius: 14px; border: none; background: #0a0a0a; color: {{accent}}; font-weight: 700; font-size: 15px; padding: 0 14px; display: flex; align-items: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffd100" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="m7 10 5 5 5-5"></path><path d="M5 20h14"></path></svg>
      PDF
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; background: rgba(10,10,10,0.08); border-radius: 16px; padding: 4px">
    <button aria-label="Voriger Monat" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #0a0a0a; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffd100" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <div style="flex: 1; text-align: center; font-weight: 800; font-size: 17px">Oktober 2026</div>
    <button aria-label="Nächster Monat" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #0a0a0a; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffd100" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </button>
  </div>

  <div style="background: #0a0a0a; color: #ffffff; border-radius: 22px; padding: 16px; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1">
      <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: #c9c9c9">14 Dienste · 112:30 Std.</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; color: {{accent}}">2.847,50 €</div>
    </div>
  </div>

  <sc-for list="{{dienste}}" as="d" hint-placeholder-count="4">
    <div style="background: #ffffff; border: 3px solid #0a0a0a; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="background: #0a0a0a; color: {{accent}}; border-radius: 10px; padding: 4px 9px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px">{{d.tag}}</div>
        <div style="flex: 1; font-weight: 700; font-size: 15px">Dienst {{d.nr}}</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px">{{d.dauer}}</div>
      </div>
      <div style="display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 14px">
        <div style="background: #0a0a0a; color: #ffffff; border-radius: 8px; padding: 3px 0; text-align: center; font-weight: 700; font-size: 12px">Beginn</div>
        <div><b>{{d.beginn}}</b> · {{d.von}}</div>
        <div style="background: rgba(10,10,10,0.1); border-radius: 8px; padding: 3px 0; text-align: center; font-weight: 700; font-size: 12px">Ende</div>
        <div><b>{{d.ende}}</b> · {{d.nach}}</div>
      </div>
    </div>
  </sc-for>

  <nav aria-label="Hauptmenü" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #0a0a0a; border-radius: 28px 28px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 10px 8px 10px">
    <button style="height: 56px; border: none; background: transparent; color: #d4d4d4; font-weight: 600; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg>Start</button>
    <button style="height: 56px; border: none; background: transparent; color: #d4d4d4; font-weight: 600; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Erfassen</button>
    <button style="height: 56px; border: none; background: transparent; color: #d4d4d4; font-weight: 600; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>Kalender</button>
    <button style="height: 56px; margin: 0 4px; border: none; border-radius: 16px; background: {{accent}}; color: #0a0a0a; font-weight: 700; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12"></path><path d="M8 12h12"></path><path d="M8 18h12"></path><path d="M4 6h.01"></path><path d="M4 12h.01"></path><path d="M4 18h.01"></path></svg>Liste</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd100","options":["#ffd100","#ffc400","#ffdd33","#f5b800"]},"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#ffd100',
      dienste: [
        { tag: 'Do 01.', nr: '3104', dauer: '7:58', beginn: '05:12', von: 'Betriebshof', ende: '13:40', nach: 'U Hermannplatz' },
        { tag: 'Fr 02.', nr: '3211', dauer: '8:10', beginn: '13:05', von: 'S Schöneweide', ende: '21:45', nach: 'Betriebshof' },
        { tag: 'Mo 05.', nr: '3108', dauer: '7:42', beginn: '05:40', von: 'Betriebshof', ende: '13:52', nach: 'U Johannisthaler Ch.' },
        { tag: 'Di 06.', nr: '3108', dauer: '7:42', beginn: '05:40', von: 'Betriebshof', ende: '13:52', nach: 'U Johannisthaler Ch.' }
      ]
    };
  }
}
</script>
</body>
</html>
